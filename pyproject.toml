[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meido"
version = "0.1.0"
description = "A Redis-backed Telegram anime delivery bot"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bot = [
    "python-telegram-bot[job-queue]==22.8",
    "python-dotenv==1.2.2",
    "redis==8.0.1",
]
worker = [
    "python-dotenv==1.2.2",
    "redis==8.0.1",
    "telethon==1.44.0",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "fakeredis==2.37.0",
]

[tool.setuptools]
packages = []
